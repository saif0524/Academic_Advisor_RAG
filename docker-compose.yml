# Containerized demo deployment (FC38): api + web. The LLM stays external —
# the api container reaches the HOST machine's Ollama via host.docker.internal.
#
#   docker compose up --build        # api → http://localhost:8000  web → http://localhost:3000
#
# Compose auto-reads this directory's .env for ${VAR} substitution
# (see .env.example): OLLAMA_API_KEY and any ADVISOR_* overrides.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Ollama Cloud models (ADVISOR_LLM_MODEL default glm-5.3-flash:cloud)
      # authenticate with the key from .env (FC36: no auth inside the stack).
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ADVISOR_LLM_PROVIDER: ${ADVISOR_LLM_PROVIDER:-ollama}
      ADVISOR_LLM_MODEL: ${ADVISOR_LLM_MODEL:-glm-5.3-flash:cloud}
      # Ollama runs on the host, not in a container — host.docker.internal.
      ADVISOR_LLM_BASE_URL: ${ADVISOR_LLM_BASE_URL:-http://host.docker.internal:11434}
      ADVISOR_EMBEDDING_FUNCTION: ${ADVISOR_EMBEDDING_FUNCTION:-onnx}
      ADVISOR_SEED_MODE: ${ADVISOR_SEED_MODE:-reload}
      ADVISOR_CORS_ORIGINS: ${ADVISOR_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    extra_hosts:
      # Makes host.docker.internal work on Linux engines too
      # (Docker Desktop maps it to the host natively).
      - "host.docker.internal:host-gateway"
    volumes:
      # User-owned chat/plan/preference tables persist across restarts (FC34);
      # seed-owned tables reload from data/ every startup (FC33).
      - advisor-var:/app/var
      # ONNX MiniLM download cache — pay the one-time model download once.
      - advisor-model-cache:/root/.cache/chroma

  web:
    build:
      context: ./src/frontend
      args:
        # Browser-side URL → the compose-mapped api port on the host.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"

volumes:
  advisor-var:
  advisor-model-cache: