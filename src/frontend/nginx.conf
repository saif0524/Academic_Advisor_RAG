# Minimal SPA config for the advisor frontend (FC38 web service).
# History-API routes must fall back to index.html for client-side routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static bundle is content-hashed by Vite — cache it hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}